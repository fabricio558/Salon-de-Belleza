<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Salón de Belleza</title>
    <!-- Fuente elegante desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%), 
                        radial-gradient(circle, rgba(255,192,203,0.3) 0%, rgba(255,255,255,1) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(230, 150, 170, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #f2d6dc;
        }

        .avatar-icon {
            width: 70px;
            height: 70px;
            background-color: #fce4ec;
            color: #d81b60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #4a4a4a;
            font-size: 26px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #7a7a7a;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #e91e63;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(233, 30, 99, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #e91e63, #f48fb1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        }

        .divider {
            margin: 25px 0 20px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #e0e0e0;
            z-index: 1;
        }

        .divider span {
            background-color: #ffffff;
            padding: 0 10px;
            position: relative;
            z-index: 2;
            color: #a0a0a0;
            font-size: 12px;
        }

        .btn-register {
            display: inline-block;
            width: 100%;
            padding: 11px;
            background-color: transparent;
            border: 2px solid #e91e63;
            border-radius: 10px;
            color: #e91e63;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #fce4ec;
            color: #c2185b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícono decorativo tipo espejo/estética -->
        <div class="avatar-icon">✨</div>
        
        <h1>INICIO DE SESIÓN</h1>

        <form action="../../proyecto/PHP/sesion.php" method="post" id="todo"> 
            <div class="form-group">
                <label for="usuario">USUARIO</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="contra">CONTRASEÑA</label>
                <input type="password" id="contra" name="contra" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="divider">
            <span>¿Aún no tienes cuenta?</span>
        </div>

        <!-- Botón para redirigir a registrarte.html -->
        <a href="../../proyecto/html/registrarte.html" class="btn-register">Registrarse</a>
    </div>

</body>
</html>
