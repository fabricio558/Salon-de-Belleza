<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Salón de Belleza</title>
    <!-- Fuente elegante desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%), 
                        radial-gradient(circle, rgba(255,192,203,0.3) 0%, rgba(255,255,255,1) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(230, 150, 170, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #f2d6dc;
        }

        .avatar-icon {
            width: 70px;
            height: 70px;
            background-color: #fce4ec;
            color: #d81b60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #4a4a4a;
            font-size: 26px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7a7a7a;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="date"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.3s ease;
            outline: none;
            color: #333;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus {
            border-color: #e91e63;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(233, 30, 99, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #e91e63, #f48fb1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        }

        .divider {
            margin: 20px 0 15px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #e0e0e0;
            z-index: 1;
        }

        .divider span {
            background-color: #ffffff;
            padding: 0 10px;
            position: relative;
            z-index: 2;
            color: #a0a0a0;
            font-size: 12px;
        }

        .btn-login {
            display: inline-block;
            width: 100%;
            padding: 11px;
            background-color: transparent;
            border: 2px solid #e91e63;
            border-radius: 10px;
            color: #e91e63;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #fce4ec;
            color: #c2185b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícono decorativo -->
        <div class="avatar-icon">💅</div>
        
        <h1>CREAR CUENTA</h1>

        <form action="../../proyecto/PHP/registrar.php" method="post"> 
            
            <div class="form-group">
                <label for="nombre">NOMBRE</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group">
                <label for="apellido">APELLIDO</label>
                <!-- name="apellido" asignado correctamente -->
                <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
            </div>

            <div class="form-group">
                <label for="usuario">NOMBRE DE USUARIO</label>
                <!-- name="usuario" asignado correctamente -->
                <input type="text" id="usuario" name="usuario" placeholder="Crea un nombre de usuario" required>
            </div>

            <div class="form-group">
                <label for="contrasena">CONTRASEÑA</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="fechaN">FECHA DE NACIMIENTO</label>
                <!-- name="fechaN" asignado correctamente -->
                <input type="date" id="fechaN" name="fechaN" required>
            </div>

            <div class="form-group">
                <label for="correo">CORREO ELECTRÓNICO</label>
                <!-- name="correo" asignado correctamente -->
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="btn-submit">REGISTRARSE</button>
        </form>

        <div class="divider">
            <span>¿Ya tienes una cuenta?</span>
        </div>

        <!-- Botón para regresar al Login -->
        <a href="login.html" class="btn-login">Iniciar Sesión</a>
    </div>

</body>
</html>>
